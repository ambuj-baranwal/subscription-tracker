# version: "3.4"
services:
  db:
    image: postgres:alpine
    container_name: postgres-tracker
    restart: always
    # command: ["sh", "-c", "echo '--- Verifying Variables ---' && printenv | grep POSTGRES && echo '-------------------------' && sleep 60"]
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - ${DB_PORT}:5432
    expose:
      - "5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h localhost -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 30s
      retries: 5
      # start_period: 30s
    volumes: # for persistent data
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    # attach: false # for running in background without any log on terminal

volumes:
  postgres-data: {}
